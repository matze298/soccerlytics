minimum_prek_version = "0.5.5"

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-shebang-scripts-are-executable" },
    { id = "detect-private-key" },
    { id = "check-added-large-files", args = ["--maxkb=1024"] },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer", exclude = "scripts/__marimo__/session/" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff lint"
entry = "uv run ruff check --fix ."
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
entry = "uv run ruff format ."
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "ty-check"
name = "ty check"
entry = "uv run ty check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock check"
entry = "uv lock --check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "import-linter"
name = "Package layer check"
entry = "uv run lint-imports"
language = "system"
pass_filenames = false
always_run = true
