[project]
name = "soccer-workspace"
version = "0.1.0"
description = "Workspace for soccer data analysis and visualizations"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "marimo>=0.19",
    "polars>=2.0.0",
    "soccer-analysis",
    "soccer-sources",
    "soccer-visualization",
    "typer>=0.20",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
[tool.uv]
package = false

[tool.uv.workspace]
members = ["soccer-analysis", "soccer-sources", "soccer-visualization"]

[tool.uv.sources]
soccer-analysis = { workspace = true }
soccer-sources = { workspace = true }
soccer-visualization = { workspace = true }

[tool.importlinter]
root_packages = ["soccer_visualization", "soccer_analysis", "soccer_sources"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Workspace package layers"
type = "layers"
layers = ["soccer_visualization", "soccer_analysis", "soccer_sources"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "missing-trailing-comma", # The formatter owns trailing commas.
    "missing-copyright-notice", # This repository has no per-file copyright notice policy.
]

[tool.ruff.lint.per-file-ignores]
# Marimo cells infer signatures and dependencies, render final expressions, and use local imports.
"scripts/*.py" = [
    "missing-type-function-argument",
    "missing-return-type-private-function",
    "useless-expression",
    "implicit-namespace-package",
    "invalid-argument-name",
    "import-outside-top-level",
    "too-many-arguments",
    "too-many-positional-arguments",
    "used-dummy-variable",
    "complex-structure",
    "too-many-branches",
    "too-many-statements",
    "too-many-locals",
    "complexity",
    "too-many-return-statements",
]
# Test names and expected numeric values make behavior clear without separate docstrings or constants.
"**/tests/**/*.py" = [
    "assert",
    "implicit-namespace-package",
    "undocumented-public-function",
    "magic-value-comparison",
    "float-equality-comparison",
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = [
    "soccer-analysis/tests",
    "soccer-sources/tests",
    "soccer-visualization/tests",
]
pythonpath = [
    "soccer-sources/src",
    "soccer-analysis/src",
    "soccer-visualization/src",
]
